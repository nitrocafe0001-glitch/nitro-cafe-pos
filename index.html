<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172235"><meta name="description" content="Nitro Café Kitchen Lounge menu, billing and restaurant management"><title>Nitro Café | Restaurant POS</title><link rel="stylesheet" href="style.css"></head><body><aside class="sidebar"><div class="brand"><img class="logo-img" src="nitro-cafe-logo.png" alt="Nitro Café Kitchen Lounge logo"><div><b id="shopBrand">NITRO CAFÉ</b><small>RESTAURANT OS</small></div></div><nav id="nav"><button class="active" data-page="dashboard">▦ Dashboard</button><button data-page="pos">▣ POS / Billing</button><button data-page="kitchen">♨ Kitchen Orders</button><button data-page="menu">☷ Menu Management</button><button data-page="inventory">▤ Inventory</button><button data-page="customers">♙ Customers</button><button data-page="reports">▥ Reports</button><button data-page="sales">✎ Sales Management</button><button data-page="expenses">₹ Expenses</button><button data-page="staff">♧ Staff & Roles</button><button data-page="settings">⚙ Settings</button></nav><div class="side-foot">● Shared live sync <small>All signed-in devices</small></div></aside><main class="main"><header class="top"><div><span class="muted">NITRO CAFÉ · Kitchen • Lounge</span><h1 id="pageTitle">Dashboard</h1></div><div class="topright"><span id="clock"></span><button class="primary" onclick="go('pos')">＋ New Order</button></div></header><div id="content"></div><footer>NITRO CAFÉ POS · Shared data sync across signed-in devices</footer></main><div id="toast"></div>
<div id="loginGate" style="position:fixed;inset:0;background:#101827;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px">
 <form id="loginForm" style="background:#fff;color:#172235;padding:28px;border-radius:16px;width:min(100%,380px);box-shadow:0 20px 60px #0005">
  <h2 style="margin:0 0 8px">NITRO CAFÉ</h2><p style="color:#596579;margin:0 0 20px">Sign in to access shared live sales and menu data.</p>
  <label for="posPassword">Shared login password</label><input id="posPassword" type="password" required minlength="8" autocomplete="current-password" style="width:100%;padding:13px;margin:8px 0 14px;border:1px solid #ccd2dc;border-radius:8px">
  <button type="submit" style="width:100%;padding:13px;border:0;border-radius:8px;background:#172235;color:#fff;font-weight:700">Login</button>
  <p id="loginError" style="color:#b42318;font-size:13px"></p>
 </form>
</div>
<script>
(async()=>{
 const gate=document.getElementById('loginGate'),form=document.getElementById('loginForm'),err=document.getElementById('loginError');
 async function start(password){
  const r=await fetch('/api/shared-data',{headers:{'x-pos-password':password}});
  if(!r.ok)throw new Error('Login failed or shared sync is not configured.');
  sessionStorage.setItem('nitroPosPassword',password);
  const script=document.createElement('script');script.src='app.js';document.body.appendChild(script);gate.remove();
 }
 const saved=sessionStorage.getItem('nitroPosPassword');
 if(saved){try{await start(saved);return}catch(e){sessionStorage.removeItem('nitroPosPassword')}}
 form.addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='Checking…';
  const password=document.getElementById('posPassword').value;
  try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Login failed');await start(password)}
  catch(e){err.textContent=e.message}
 });
})();
</script></body></html>
